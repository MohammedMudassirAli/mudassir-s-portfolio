<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cafe House</title>
</head>
<body>
    
  <style>
      body {
  background-image: url("/coffee.webp");
  background-size: cover;       /* scales image to cover the screen */
  background-position: center;  /* centers the image */
  margin: 0;
  padding: 0;

    }

    .menu {
      background-color: #a0773d;
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      border-radius: 5px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      border-bottom: 2px solid #420505;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    a {
      color: #020241;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="menu">
    <h1>The Cafe House</h1>
    <p><em>Est. 1985</em></p>

    <h2>Coffee ☕</h2>
    <div class="item"><span>French Vanilla</span><span>5.00</span></div>
    <div class="item"><span>Caramel Macchiato</span><span>6.75</span></div>
    <div class="item"><span>Pumpkin Spice</span><span>8.00</span></div>
    <div class="item"><span>Hazelnut</span><span>4.00</span></div>
    <div class="item"><span>Mocha</span><span>4.50</span></div>

    <h2>Desserts 🍰</h2>
    <div class="item"><span>Donut</span><span>1.50</span></div>
    <div class="item"><span>Cherry Pie</span><span>2.75</span></div>
    <div class="item"><span>Cheesecake</span><span>3.00</span></div>
    <div class="item"><span>Cinnamon Roll</span><span>2.50</span></div>

    <hr style="border: 1px solid #2b0505;">
    <p><a href="#thecafehouse.in">Thecafehouse</a></p>
    <p>Thank you for wisiting 

    </p>
  </div>

</body>
</html>
