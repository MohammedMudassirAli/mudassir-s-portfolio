<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Brand Shoe Company</title>
</head>
<body>
<div class="card">
  <div class="image-container">
    <img src="https://i5.walmartimages.com/seo/2026-Trend-Men-s-Sneakers-Cloud-Tech-Breathable-All-Season-Comfort-Simple-Trendy_362f56ba-ecde-4bb7-868c-2626a080d6df.f4f7563e274a7ffe64c8909f4c44c409.jpeg?odnHeight=573&odnWidth=573&odnBg=FFFFFF" height="100px" width="200" alt="Running Sneakers">
    
    <!-- Favorite Button Overlay -->
    <button class="favorite-btn" onclick="toggleFavorite(this)">🤍</button>
  </div>
  
  <div class="card-content">
    <h2>Running Sneakers</h2>
    <p>Lightweight, breathable, and perfect for everyday wear.</p>
    <div class="price">₹4999.00</div>
    
    <!-- Rating Stars -->
    <div class="rating">⭐⭐⭐⭐☆</div>
    
    <!-- Buttons -->
    <div class="actions">
      <a href="#" class="btn">🛒 Add to Cart</a>
    </div>
  </div>
</div>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0e1e1;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #8d8d8d;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    width: 300px;
    transition: transform 0.3s ease;
  }
  .card:hover {
    transform: scale(1.05);
  }
  .image-container {
    position: relative;
  }
  .image-container img {
    width: 100%;
    height: auto;
    display: block;
  }
  .favorite-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #fff;
    border: none;
    border-radius: 50%;
    padding: 8px;
    cursor: pointer;
    font-size: 20px;
    color: black; /* Default black */
    filter: grayscale(100%); /* Makes it black & white */
    box-shadow: 0 2px 6px rgba(12, 9, 9, 0.2);
    transition: transform 0.2s ease, background 0.3s ease, color 0.3s ease, filter 0.3s ease;
  }
  .favorite-btn:hover {
    transform: scale(1.2);
    background: #000;
    color: #fff;
    filter: none; /* Removes grayscale on hover */
  }
  .card-content {
    padding: 15px;
    text-align: center;
  }
  .price {
    font-size: 18px;
    font-weight: bold;
    color: #070707;
    margin: 10px 0;
  }
  .rating {
    margin: 10px 0;
    font-size: 18px;
    color: #b0b308;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: inline-block;
    padding: 10px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    transition: background 0.3s ease;
    text-align: center;
    background: #2e8b57;
    color: #fff;
  }
  .btn:hover {
    background: #050807;
  }
  .btn.quick-view {
    background: #007bff;
  }
  .btn.quick-view:hover {
    background: #0056b3;
  }

  /* Responsive Design */
  @media (max-width: 500px) {
    .card {
      width: 90%;
    }
    .btn {
      font-size: 14px;
      padding: 8px;
    }
  }
</style>

<script>
  function toggleFavorite(button) {
    if (button.textContent === "🤍") {
      button.textContent = "❤️";
      button.style.color = "red";
      button.style.filter = "none"; // show color when favorited
    } else {
      button.textContent = "🤍";
      button.style.color = "black";
      button.style.filter = "grayscale(100%)"; // back to black & white
    }
  }
</script>

</body>
</html>
