<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Registration Form</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:linear-gradient(
135deg,
#575758,
#1e293b,
#bebcf3
);
}

form{
width:100%;
max-width:420px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.15);

border-radius:20px;

padding:30px;

box-shadow:0 20px 40px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:white;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

input[type="email"],
input[type="tel"],
input[type="password"],
input[type="text"]{

width:100%;

padding:14px;

border:none;
outline:none;

border-radius:10px;

background:rgba(255,255,255,.12);

color:white;
font-size:1rem;
}

input::placeholder{
color:#cbd5e1;
}

.password-row{
display:flex;
align-items:center;
gap:8px;

margin:12px 0;

color:white;
font-size:.9rem;
}

.password-row input{
width:auto;
}

#captchaText{
padding:12px;
margin-bottom:12px;

background:rgba(6, 70, 173, 0.15);

border-radius:10px;

text-align:center;

color:#38bdf8;
font-weight:bold;
letter-spacing:1px;
}

button{
width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#3b82f6;

color:white;

font-size:1rem;
font-weight:600;

cursor:pointer;

transition:.3s;
}

button:hover{
background:#2563eb;
transform:translateY(-2px);
}

button:disabled{
background:#0f1a2b;
cursor:not-allowed;
transform:none;
}

.message{
margin-top:15px;
text-align:center;
font-weight:600;
}

.success{
color:#22c55e;
}

.error{
color:#ef4444;
}

@media(max-width:480px){

form{
padding:20px;
}

h2{
font-size:1.5rem;
}

input{
padding:12px;
}

button{
padding:12px;
}

}

</style>
</head>

<body>

<form id="registerForm">

<h2>Create Account</h2>

<div class="input-group">
<input
type="email"
id="email"
placeholder="Enter Email"
required>
</div>

<div class="input-group">
<input
type="tel"
id="phone"
placeholder="Enter Phone Number"
required>
</div>

<div class="input-group">
<input
type="password"
id="pass"
placeholder="Enter Password"
required>
</div>

<div class="input-group">
<input
type="password"
id="confirm"
placeholder="Confirm Password"
required>
</div>

<div class="password-row">
<input
type="checkbox"
onclick="togglePass()">
<span>Show Passwords</span>
</div>

<p id="captchaText"></p>

<div class="input-group">
<input
type="text"
id="captchaInput"
placeholder="Enter Captcha"
required>
</div>

<button
type="submit"
id="submitBtn"
disabled>
Register
</button>

<div id="msg" class="message"></div>

</form>

<script>

let captcha =
Math.floor(
Math.random()*9000 + 1000
);

document
.getElementById("captchaText")
.innerText =
"Captcha: " + captcha;

function togglePass(){

const pass =
document.getElementById("pass");

const confirm =
document.getElementById("confirm");

pass.type =
pass.type === "password"
? "text"
: "password";

confirm.type =
confirm.type === "password"
? "text"
: "password";

}

document.addEventListener(
"input",
validateForm
);

function validateForm(){

const email =
document.getElementById("email")
.value.trim();

const phone =
document.getElementById("phone")
.value.trim();

const pass =
document.getElementById("pass")
.value;

const confirm =
document.getElementById("confirm")
.value;

const captchaInput =
document.getElementById("captchaInput")
.value.trim();

const validPhone =
/^[0-9]{10}$/
.test(phone);

const validEmail =
/^\S+@\S+\.\S+$/
.test(email);

document
.getElementById("submitBtn")
.disabled = !(
validEmail &&
validPhone &&
pass.length >= 6 &&
pass === confirm &&
captchaInput == captcha
);

}

document
.getElementById("registerForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

const msg =
document.getElementById("msg");

msg.className =
"message success";

msg.innerText =
"✅ Registration Successful!";

this.reset();

captcha =
Math.floor(
Math.random()*9000 + 1000
);

document
.getElementById("captchaText")
.innerText =
"Captcha: " + captcha;

document
.getElementById("submitBtn")
.disabled = true;

});

</script>

</body>
</html>
