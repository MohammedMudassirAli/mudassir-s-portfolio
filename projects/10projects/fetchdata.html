<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Directory</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0c0c;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgb(209, 198, 198);
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#6fadf5;
}

#message{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
}

.loading{
    color:#2563eb;
}

.error{
    color:red;
}

#list{
    list-style:none;
}

.card{
    background:#f8fafc;
    margin-bottom:12px;
    padding:15px;
    border-radius:10px;
    border-left:5px solid #2563eb;
    transition:.3s;
}

.card:hover{
    transform:translateY(-2px);
}

.name{
    font-size:18px;
    font-weight:bold;
    color:#222;
}

.email{
    color:#666;
    margin-top:5px;
    word-break:break-word;
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    .name{
        font-size:16px;
    }

    .email{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h2>👥 User Directory</h2>

    <button onclick="fetchData()">
        Fetch Users
    </button>

    <p id="message"></p>

    <ul id="list"></ul>

</div>

<script>

async function fetchData(){

    const list =
    document.getElementById("list");

    const message =
    document.getElementById("message");

    list.innerHTML = "";

    message.textContent = "Loading...";
    message.className = "loading";

    try{

        const response =
        await fetch(
        "https://jsonplaceholder.typicode.com/users"
        );

        if(!response.ok){
            throw new Error();
        }

        const data =
        await response.json();

        message.textContent = "";

        data.forEach(user => {

            const li =
            document.createElement("li");

            li.className = "card";

            li.innerHTML = `
                <div class="name">
                    ${user.name}
                </div>

                <div class="email">
                    📧 ${user.email}
                </div>
            `;

            list.appendChild(li);

        });

    }
    catch(error){

        message.textContent =
        "❌ Failed to load users.";

        message.className = "error";

    }
}

</script>

</body>
</html>
