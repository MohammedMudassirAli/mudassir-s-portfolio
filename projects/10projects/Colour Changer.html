<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colour Changer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
    transition:background-color 0.4s ease;
}

.container{
    width:90%;
    max-width:400px;
    background:rgb(243, 168, 168);
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-align:center;
}

h2{
    margin-bottom:20px;
    transition:color 0.4s ease;
}

.control{
    margin:20px 0;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

input[type="color"]{
    width:80px;
    height:50px;
    border:none;
    background:none;
    cursor:pointer;
}

.color-code{
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    color:#0d0c0e;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#4d2f3f;
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#555;
    transform:scale(1.05);
}

@media(max-width:480px){
    .container{
        padding:20px;
    }

    h2{
        font-size:1.4rem;
    }
}
</style>
</head>
<body>

<div class="container">

    <h2 id="heading">Colour Changer App</h2>

    <div class="control">
        <label>Background Colour</label>
        <input type="color" id="bgPicker" value="#f4f4f4">
        <p class="color-code" id="bgCode">#F4F4F4</p>
    </div>

    <div class="control">
        <label>Text Colour</label>
        <input type="color" id="textPicker" value="#000000">
        <p class="color-code" id="textCode">#000000</p>
    </div>

    <button id="resetBtn">Reset Colours</button>

</div>

<script>

const bgPicker = document.getElementById("bgPicker");
const textPicker = document.getElementById("textPicker");

const bgCode = document.getElementById("bgCode");
const textCode = document.getElementById("textCode");

const heading = document.getElementById("heading");

const defaultBg = "#f4f4f4";
const defaultText = "#000000";

// Change Background Colour
bgPicker.addEventListener("input", function(){
    document.body.style.backgroundColor = this.value;
    bgCode.textContent = this.value.toUpperCase();
});

// Change Text Colour
textPicker.addEventListener("input", function(){
    heading.style.color = this.value;
    textCode.textContent = this.value.toUpperCase();
});

// Reset Colours
document.getElementById("resetBtn").addEventListener("click", function(){

    document.body.style.backgroundColor = defaultBg;
    heading.style.color = defaultText;

    bgPicker.value = defaultBg;
    textPicker.value = defaultText;

    bgCode.textContent = defaultBg.toUpperCase();
    textCode.textContent = defaultText.toUpperCase();
});

</script>

</body>
</html>
