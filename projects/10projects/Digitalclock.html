<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
}

.clock-container{
    width:min(90%,500px);
    padding:40px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.1);
}

.date{
    color:#cbd5e1;
    font-size:1.1rem;
    margin-bottom:25px;
    letter-spacing:1px;
}

.time24{
    font-size:clamp(2.5rem,7vw,4.5rem);
    font-weight:700;
    color:#38bdf8;
    margin-bottom:15px;
}

.time12{
    font-size:clamp(1.5rem,4vw,2rem);

    color:#f8fafc;
}

.label{
    color:#0c0c0c;
    margin-top:8px;
    font-size:0.9rem;
    text-transform:uppercase;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="clock-container">
    <div class="date" id="date"></div>

    <div class="time24" id="time24"></div>
    <div class="label">24 Hour Format</div>

    <br>

    <div class="time12" id="time12"></div>
    <div class="label">12 Hour Format</div>
</div>

<script>
function updateClock(){

    const now = new Date();

    document.getElementById("date").innerHTML =
        now.toDateString();

    document.getElementById("time24").innerHTML =
        now.toLocaleTimeString("en-GB",{
            hour12:false
        });

    document.getElementById("time12").innerHTML =
        now.toLocaleTimeString("en-US",{
            hour12:true
        });
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
