<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Countdown Timer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#312e81
);

padding:20px;
}

.container{

width:100%;
max-width:420px;

padding:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.1);

border-radius:30px;

box-shadow:0 25px 40px rgba(0,0,0,.3);

text-align:center;
}

h1{
color:#fff;
margin-bottom:25px;
font-size:2rem;
}

.input-group{
display:flex;
gap:10px;
margin-bottom:25px;
}

input{
flex:1;
padding:14px;

border:none;
outline:none;

border-radius:12px;

background:rgba(255,255,255,.1);

color:white;
font-size:1rem;
text-align:center;
}

input::placeholder{
color:#ccc;
}

.timer-circle{

width:220px;
height:220px;

margin:25px auto;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:
conic-gradient(
#38bdf8 0deg,
#8b5cf6 180deg,
#ec4899 360deg
);

padding:10px;
}

.inner-circle{

width:100%;
height:100%;

border-radius:50%;

background:#0f172a;

display:flex;
justify-content:center;
align-items:center;

flex-direction:column;
}

#display{
font-size:3rem;
font-weight:700;
color:white;
}

.label{
color:#94a3b8;
font-size:.9rem;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
cursor:pointer;
border-radius:12px;

font-size:1rem;
font-weight:600;

transition:.3s;
}

.start{
background:#22c55e;
color:white;
}

.pause{
background:#eab308;
color:black;
}

.reset{
background:#ef4444;
color:white;
}

button:hover{
transform:translateY(-3px);
}

.status{
margin-top:20px;
color:#cbd5e1;
font-size:.9rem;
}

@media(max-width:480px){

.timer-circle{
width:180px;
height:180px;
}

#display{
font-size:2.3rem;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<h1>⏳ Countdown Timer</h1>

<div class="input-group">
<input
type="number"
id="seconds"
min="1"
placeholder="Enter seconds"
value="60">
</div>

<div class="timer-circle">

<div class="inner-circle">

<div id="display">60</div>

<div class="label">Seconds Left</div>

</div>

</div>

<div class="buttons">

<button class="start" onclick="startTimer()">
Start
</button>

<button class="pause" onclick="pauseTimer()">
Pause
</button>

<button class="reset" onclick="resetTimer()">
Reset
</button>

</div>

<div class="status" id="status">
Ready to start
</div>

</div>

<script>

let interval;
let remainingTime = 60;
let isRunning = false;

const display =
document.getElementById("display");

const input =
document.getElementById("seconds");

const status =
document.getElementById("status");

function updateDisplay(){
display.innerText = remainingTime;
}

function startTimer(){

if(!isRunning){

if(remainingTime <= 0){
remainingTime =
parseInt(input.value) || 60;
}

isRunning = true;

status.innerText =
"Timer Running...";

interval = setInterval(()=>{

remainingTime--;

updateDisplay();

if(remainingTime <= 0){

clearInterval(interval);

display.innerText = "0";

status.innerText =
"✅ Time is Up!";

alert("⏰ Time Up!");

isRunning = false;
}

},1000);

}

}

function pauseTimer(){

clearInterval(interval);

isRunning = false;

status.innerText =
"⏸ Timer Paused";
}

function resetTimer(){

clearInterval(interval);

isRunning = false;

remainingTime =
parseInt(input.value) || 60;

updateDisplay();

status.innerText =
"🔄 Timer Reset";
}

input.addEventListener("input",()=>{

remainingTime =
parseInt(input.value) || 0;

updateDisplay();

});

updateDisplay();

</script>

</body>
</html>
