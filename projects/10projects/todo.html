<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Todo List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#312e81
);
}

.container{

width:100%;
max-width:500px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.1);

border-radius:20px;

padding:25px;

box-shadow:0 20px 40px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:white;
margin-bottom:20px;
}

.input-group{
display:flex;
gap:10px;
margin-bottom:20px;
}

input{
flex:1;

padding:14px;

border:none;
outline:none;

border-radius:10px;

background:rgba(255,255,255,.12);

color:white;
font-size:1rem;
}

input::placeholder{
color:#cbd5e1;
}

.add-btn{

padding:14px 20px;

border:none;

border-radius:10px;

background:#3b82f6;

color:white;

cursor:pointer;

font-weight:600;

transition:.3s;
}

.add-btn:hover{
background:#2563eb;
}

ul{
list-style:none;
}

li{
display:flex;
justify-content:space-between;
align-items:center;

gap:10px;

padding:14px;
margin-bottom:12px;

background:rgba(255,255,255,.08);

border-radius:12px;

color:white;

word-break:break-word;
}

.task-text{
flex:1;
}

.action-buttons{
display:flex;
gap:6px;
}

.edit-btn{
background:#f59e0b;
}

.delete-btn{
background:#ef4444;
}

.edit-btn,
.delete-btn{

border:none;

padding:8px 12px;

border-radius:8px;

color:white;

cursor:pointer;

transition:.3s;
}

.edit-btn:hover{
background:#d97706;
}

.delete-btn:hover{
background:#dc2626;
}

@media(max-width:500px){

.input-group{
flex-direction:column;
}

.add-btn{
width:100%;
}

li{
flex-direction:column;
align-items:flex-start;
}

.action-buttons{
width:100%;
display:flex;
}

.edit-btn,
.delete-btn{
flex:1;
}

}

</style>
</head>

<body>

<div class="container">

<h2>📝 Todo List</h2>

<div class="input-group">

<input
type="text"
id="task"
placeholder="Enter a task">

<button
class="add-btn"
onclick="addTask()">
Add
</button>

</div>

<ul id="tasks"></ul>

</div>

<script>

function addTask(){

let task =
document.getElementById("task").value.trim();

if(task==="") return;

let li =
document.createElement("li");

li.innerHTML = `
<span class="task-text">${task}</span>

<div class="action-buttons">

<button
class="edit-btn"
onclick="editTask(this)">
Edit
</button>

<button
class="delete-btn"
onclick="deleteTask(this)">
Delete
</button>

</div>
`;

document
.getElementById("tasks")
.appendChild(li);

document
.getElementById("task")
.value="";
}

function editTask(btn){

let taskText =
btn.parentElement.previousElementSibling;

let updated =
prompt(
"Edit Task",
taskText.textContent
);

if(updated && updated.trim() !== ""){

taskText.textContent =
updated.trim();

}

}

function deleteTask(btn){

btn.closest("li").remove();

}

</script>

</body>
</html>
