<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Traffic Management System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:900px;
}

.status-box{
background:white;
padding:15px;
border-radius:15px;
text-align:center;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.status-box h2{
color:#0f172a;
margin-bottom:5px;
}

.status-box p{
font-weight:bold;
color:#16a34a;
}

.intersection{
position:relative;
width:700px;
height:700px;
max-width:95vw;
max-height:95vw;
margin:auto;
}

/* Roads */

.road-horizontal{
position:absolute;
width:100%;
height:180px;
top:50%;
transform:translateY(-50%);
background:#2b2b2b;
border-top:3px solid #444;
border-bottom:3px solid #444;
}

.road-vertical{
position:absolute;
height:100%;
width:180px;
left:50%;
transform:translateX(-50%);
background:#2b2b2b;
border-left:3px solid #444;
border-right:3px solid #444;
}

/* Lane Markings */

.road-horizontal::before{
content:"";
position:absolute;
top:50%;
width:100%;
height:4px;
background:repeating-linear-gradient(
to right,
white 0 35px,
transparent 35px 70px
);
}

.road-vertical::before{
content:"";
position:absolute;
left:50%;
width:4px;
height:100%;
background:repeating-linear-gradient(
to bottom,
white 0 35px,
transparent 35px 70px
);
}

/* Signals */

.signal{
position:absolute;
background:#111;
padding:10px;
border-radius:12px;
display:flex;
flex-direction:column;
gap:8px;
align-items:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.light{
width:50px;
height:50px;
border-radius:50%;
background:#444;
transition:.3s;
}

.red.active{
background:#ff2d2d;
box-shadow:0 0 20px red;
}

.yellow.active{
background:#ffd000;
box-shadow:0 0 20px yellow;
}

.green.active{
background:#00ff66;
box-shadow:0 0 20px lime;
}

.label{
color:white;
font-weight:bold;
font-size:.9rem;
}

/* Signal Positions */

#north{
top:70px;
left:50%;
transform:translateX(-50%);
}

#south{
bottom:70px;
left:50%;
transform:translateX(-50%);
}

#east{
right:70px;
top:50%;
transform:translateY(-50%);
}

#west{
left:70px;
top:50%;
transform:translateY(-50%);
}

/* Timer */

.countdown{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

width:130px;
height:130px;
border-radius:50%;

background:white;

display:flex;
justify-content:center;
align-items:center;

font-size:2.2rem;
font-weight:800;
color:#0f172a;

box-shadow:0 0 30px rgba(255,255,255,.25);
}

@media(max-width:768px){

.intersection{
width:95vw;
height:95vw;
}

.road-horizontal{
height:120px;
}

.road-vertical{
width:120px;
}

.signal{
padding:6px;
}

.light{
width:35px;
height:35px;
}

.label{
font-size:.75rem;
}

.countdown{
width:80px;
height:80px;
font-size:1.4rem;
}

#north{
top:20px;
}

#south{
bottom:20px;
}

#east{
right:20px;
}

#west{
left:20px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="status-box">
<h2 id="activeRoad">North & South Road</h2>
<p id="signalStatus">GREEN - GO</p>
</div>

<div class="intersection">

<div class="road-horizontal"></div>
<div class="road-vertical"></div>

<div class="signal" id="north">
<div class="light red"></div>
<div class="light yellow"></div>
<div class="light green"></div>
<div class="label">NORTH</div>
</div>

<div class="signal" id="south">
<div class="light red"></div>
<div class="light yellow"></div>
<div class="light green"></div>
<div class="label">SOUTH</div>
</div>

<div class="signal" id="east">
<div class="light red"></div>
<div class="light yellow"></div>
<div class="light green"></div>
<div class="label">EAST</div>
</div>

<div class="signal" id="west">
<div class="light red"></div>
<div class="light yellow"></div>
<div class="light green"></div>
<div class="label">WEST</div>
</div>

<div class="countdown" id="timer">10</div>

</div>

</div>

<script>

let phase = 0;
let timeLeft = 10;

function clearLights(){

document.querySelectorAll(".light")
.forEach(light=>{
light.classList.remove("active");
});

}

function setSignal(ids,color){

ids.forEach(id=>{

document
.getElementById(id)
.querySelector("." + color)
.classList.add("active");

});

}

function updateSignals(){

clearLights();

const road=
document.getElementById("activeRoad");

const status=
document.getElementById("signalStatus");

if(phase===0){

setSignal(["north","south"],"green");
setSignal(["east","west"],"red");

road.innerText="North & South Road";
status.innerText="GREEN - GO";
status.style.color="#16a34a";

}

else if(phase===1){

setSignal(["north","south"],"yellow");
setSignal(["east","west"],"red");

road.innerText="North & South Road";
status.innerText="YELLOW - PREPARE TO STOP";
status.style.color="#f59e0b";

}

else if(phase===2){

setSignal(["east","west"],"green");
setSignal(["north","south"],"red");

road.innerText="East & West Road";
status.innerText="GREEN - GO";
status.style.color="#16a34a";

}

else{

setSignal(["east","west"],"yellow");
setSignal(["north","south"],"red");

road.innerText="East & West Road";
status.innerText="YELLOW - PREPARE TO STOP";
status.style.color="#f59e0b";

}

}

updateSignals();

setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerText=timeLeft;

if(timeLeft<=0){

phase++;

if(phase>3){
phase=0;
}

updateSignals();

if(phase===0 || phase===2){
timeLeft=10;
}
else{
timeLeft=3;
}

document.getElementById("timer")
.innerText=timeLeft;

}

},1000);

</script>

</body>
</html>
