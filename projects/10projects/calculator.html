<!DOCTYPE html>
<html>
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#012333;
    padding:15px;
}

.calculator{
    width:100%;
    max-width:350px;
    background:#454557;
    padding:20px;
    border-radius:12px;
}

#display{
    width:100%;
    height:70px;
    font-size:2rem;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    width:100%;
    height:60px;
    font-size:1.3rem;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#111010;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#666;
}

/* Mobile Screens */
@media (max-width:480px){
    .calculator{
        max-width:100%;
        padding:15px;
    }

    #display{
        height:60px;
        font-size:1.5rem;
    }

    button{
        height:55px;
        font-size:1.1rem;
    }
}
</style>
</head>
<body>

<div class="calculator">
<input type="text" id="display">

<div class="buttons">
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('/')">/</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('*')">*</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('-')">-</button>

    <button onclick="add('0')">0</button>
    <button onclick="clearDisplay()">C</button>
    <button onclick="calculate()">=</button>
    <button onclick="add('+')">+</button>
</div>
<script>
function add(value){
 document.getElementById("display").value+=value;
}

function clearDisplay(){
 document.getElementById("display").value="";
}

function calculate(){
 document.getElementById("display").value=
 eval(document.getElementById("display").value);
}
</script>

</body>
</html>
